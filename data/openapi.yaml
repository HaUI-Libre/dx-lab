openapi: 3.0.3
info:
  title: DX-Lab Data API
  version: 0.3.0
  description: |
    Contract for DX-Helpdesk ticket data, metadata and dashboard statistics.
    Ticket CRUD and workflow actions are implemented in issue #20. Issue #21
    adds provenance reads, rating audit and asset update outcomes. Locations,
    technicians and attachment metadata support the reporting UI (#26).
    Statistics remain separate work.
    The UI reaches this API through APISIX
    with a Keycloak access token. Flowable owns workflow transitions; status,
    assignee and process instance fields are read-only in this public API.
servers:
  - url: /api/data
security:
  - bearerAuth: []
tags:
  - name: Tickets
  - name: Attachments
  - name: History
  - name: Dashboard
paths:
  /tickets:
    get:
      tags: [Tickets]
      summary: List and filter tickets
      description: |
        Students may list only their own tickets; technicians may list tickets
        they created or were assigned at their site; managers may list tickets
        at their site and admins may list all. The API derives
        ownership and roles from the verified token, not query parameters.
        Soft-deleted drafts are excluded.
      operationId: listTickets
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/TicketCategory'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: q
          in: query
          description: Search title, description and ticket code (DXL-NNNN).
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Ticket page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidInput' }
    post:
      tags: [Tickets]
      summary: Create a draft ticket
      description: |
        Any of the four DX-Helpdesk roles may create a draft. The API takes
        created_by from the token and sets source, timestamps and DRAFT status.
        Submission and later transitions are handled through the workflow,
        not by setting status in this request.
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
            example:
              title: Máy PC-04 phòng 301 không khởi động được
              description: Máy không lên nguồn khi bắt đầu buổi thực hành.
              category: HARDWARE
              priority: HIGH
              location: Phòng 301
              asset_id: 42
              location_id: 6
      responses:
        '201':
          description: Draft created.
          headers:
            Location:
              description: URL of the ticket.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /tickets/by-code/{code}:
    get:
      tags: [Tickets]
      summary: Look up a ticket by its human-readable code
      description: Uses the same visibility rules as GET /tickets/{ticketId}; inaccessible codes return 404.
      operationId: getTicketByCode
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^DXL-[0-9]{4,}$' }
      responses:
        '200':
          description: Visible ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      summary: Get a ticket
      description: Students see their own tickets; technicians see tickets they created or were assigned at their site; managers see their site and admins see all.
      operationId: getTicket
      responses:
        '200':
          description: Ticket detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      summary: Edit a draft ticket
      description: |
        Only its creator may edit a DRAFT. Status, assignee, workflow ID,
        creator and timestamps cannot be changed here. A non-draft returns 409.
        The implementation must record the edit in ticket_events.
      operationId: updateDraftTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
    delete:
      tags: [Tickets]
      summary: Delete a draft ticket
      description: |
        Only its creator may soft-delete a DRAFT. The ticket and history remain
        in PostgreSQL for audit. A non-draft returns 409.
      operationId: deleteDraftTicket
      responses:
        '204':
          description: Draft soft-deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets/{ticketId}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [submit, accept, reject, assign, start, resolve, close, reopen]
    post:
      tags: [Tickets]
      summary: Advance ticket and matching Flowable task
      description: |
        submit starts the process. accept/reject/assign/close/reopen require
        a manager at the ticket site; start/resolve require the assigned
        technician. reject and reopen require a reason. assign verifies the
        technician's Keycloak role and co_so server-side. No request may set
        status or co_so directly. With an asset, the server fetches its current
        location from the asset service and ignores client location_id. Without
        an asset, the selected location_id is used. A workflow mismatch returns 409.
      operationId: advanceTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionBody' }
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /tickets/{ticketId}/attachments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Attachments]
      summary: List attachment metadata
      description: Uses the same ticket visibility rules as getTicket. File bytes are served by /api/files.
      operationId: listTicketAttachments
      responses:
        '200':
          description: Active attachment metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      summary: Register an uploaded attachment
      description: |
        Upload bytes through /api/files first. The API must verify that the
        storage key belongs to this caller and ticket before recording it.
        The creator may add an attachment to a DRAFT or SUBMITTED ticket.
        The implementation must record the change in ticket_events.
      operationId: addTicketAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreate'
      responses:
        '201':
          description: Attachment registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /locations:
    get:
      tags: [Tickets]
      summary: List reporting locations
      description: Locations from site_locations, used when the asset system is unavailable.
      operationId: listLocations
      responses:
        '200':
          description: All locations with their site.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [location_id, code, co_so]
                  properties:
                    location_id: { type: integer }
                    code: { type: string }
                    co_so: { type: string, enum: [CS1, CS2, CS3] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /technicians:
    get:
      tags: [Tickets]
      summary: List technicians a manager may assign
      description: |
        Managers get technicians of their own co_so; admins must pass co_so.
        assign still verifies the technician server-side.
      operationId: listTechnicians
      parameters:
        - name: co_so
          in: query
          required: false
          schema: { type: string, enum: [CS1, CS2, CS3] }
      responses:
        '200':
          description: Enabled technicians of the site.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [sub, username, name, co_so]
                  properties:
                    sub: { type: string, format: uuid }
                    username: { type: string }
                    name: { type: string }
                    co_so: { type: string, enum: [CS1, CS2, CS3] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tickets/{ticketId}/events:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [History]
      summary: Read ticket change history
      description: |
        Uses the same ticket visibility rules as getTicket. This is Data API
        provenance, ordered by occurrence time and event ID. REJECT and REOPEN
        carry their reasons; asset update attempts have PENDING, SUCCEEDED or
        FAILED events. Flowable keeps its own process/task history.
      operationId: listTicketEvents
      responses:
        '200':
          description: Events in occurrence order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{ticketId}/provenance:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [History]
      summary: Read provenance summary and full history
      description: |
        Returns ticket source, creator and timestamps, reopen_count and the
        ordered audit events. Creator or admin may also inspect a soft-deleted
        draft; other callers follow ticket site and ownership checks.
      operationId: getTicketProvenance
      responses:
        '200':
          description: Provenance summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketProvenance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{ticketId}/rating:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    put:
      tags: [Tickets]
      summary: Rate a closed ticket
      description: |
        The ticket creator may submit or replace a satisfaction rating after
        the manager closes the ticket. The API records before and after values in
        ticket_events; this operation does not change workflow state.
      operationId: rateTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRating'
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /events/stream:
    get:
      tags: [Events]
      summary: Realtime status changes (Server-Sent Events)
      description: |
        Stream of `status` events read from NATS subject `dxlab.ticket.status_changed`.
        Each event is filtered with the same visibility rule as GET /tickets/{ticket_id},
        so callers only learn about tickets they may open. A `: ping` comment is sent every
        15 seconds. The server sends `event: expired` when the access token expires and
        `event: bus-down` when NATS drops; clients reconnect and reload their data.
        Events missed while disconnected are not replayed.
      operationId: streamTicketEvents
      responses:
        '200':
          description: text/event-stream of status events.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: status
                  data: {"ticket_id":"a1111111-1111-4111-8111-111111111101","action":"submit","from_status":"DRAFT","to_status":"SUBMITTED","co_so":"CS1","actor_sub":"...","occurred_at":"2026-10-24T08:00:00Z","title":"PC-04 phòng C401 không lên nguồn"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: NATS not configured or unavailable (profile integration off).
  /stats:
    get:
      tags: [Dashboard]
      summary: Ticket statistics for the dashboard
      description: |
        Managers and admins only (#22). A manager always gets the site in
        the token's co_so claim; asking for another site returns 403. An
        admin gets every site, or one site with co_so. Counts exclude
        unsent drafts and soft-deleted tickets. The average resolution time
        uses submitted_at to resolved_at of tickets resolved at least once
        (the latest resolution after a reopen); overdue counts tickets past
        sla_due_at that are not CLOSED or REJECTED; reopen_count counts
        REOPEN events of the selected tickets.
      operationId: getTicketStats
      parameters:
        - name: co_so
          in: query
          description: Admin only; a manager may pass only their own site.
          schema: { type: string, enum: [CS1, CS2, CS3] }
        - name: from
          in: query
          description: Inclusive created_at lower bound.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive created_at upper bound.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Summary for the selected period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketStats'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidInput' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token validated at the gateway and by the API for ownership/role checks.
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Caller lacks the required role or ticket access.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Ticket was not found or was soft-deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Ticket state does not allow this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidInput:
      description: Request fails validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    TicketStatus:
      type: string
      enum: [DRAFT, SUBMITTED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, REJECTED]
    TicketCategory:
      type: string
      enum: [HARDWARE, SOFTWARE_ENVIRONMENT, NETWORK_ACCOUNT, LAB_ASSET]
    TicketPriority:
      type: string
      enum: [URGENT, HIGH, MEDIUM, LOW]
    DataSource:
      type: string
      enum: [dx-helpdesk, snipe-it, nats]
    NullableTicketStatus:
      type: string
      nullable: true
      enum: [DRAFT, SUBMITTED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED, REJECTED, null]
    NullableTicketCategory:
      type: string
      nullable: true
      enum: [HARDWARE, SOFTWARE_ENVIRONMENT, NETWORK_ACCOUNT, LAB_ASSET, null]
    NullableTicketPriority:
      type: string
      nullable: true
      enum: [URGENT, HIGH, MEDIUM, LOW, null]
    TicketCreate:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/TicketCategory'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        location:
          type: string
        location_id: { type: integer, minimum: 1, description: Snipe-IT location ID; co_so is resolved by server mapping. }
        asset_id: { type: integer, minimum: 1, description: Snipe-IT hardware ID. }
    ActionBody:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string }
        technician_sub: { type: string, description: Keycloak subject; checked against site and role. }
        resolution_summary: { type: string }
        priority: { $ref: '#/components/schemas/TicketPriority' }
    TicketRating:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
    TicketUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/TicketCategory'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        location:
          type: string
          nullable: true
        location_id: { type: integer, minimum: 1, nullable: true }
        asset_id: { type: integer, minimum: 1, nullable: true }
    Ticket:
      type: object
      additionalProperties: false
      required: [id, code, title, description, status, created_by, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^DXL-[0-9]{4,}$', description: Unique server-generated ticket code. }
        title: { type: string }
        description: { type: string }
        category:
          $ref: '#/components/schemas/NullableTicketCategory'
        priority:
          $ref: '#/components/schemas/NullableTicketPriority'
        status: { $ref: '#/components/schemas/TicketStatus' }
        location: { type: string, nullable: true }
        location_id: { type: integer, nullable: true }
        asset_id: { type: integer, nullable: true }
        co_so: { type: string, enum: [CS1, CS2, CS3], nullable: true }
        created_by: { type: string, description: Keycloak subject of the creator. }
        assigned_to: { type: string, nullable: true, description: Keycloak subject of the technician. }
        source: { $ref: '#/components/schemas/DataSource' }
        workflow_instance_id: { type: string, nullable: true }
        resolution_summary: { type: string, nullable: true }
        rejection_reason: { type: string, nullable: true }
        satisfaction_rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        sla_due_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    AttachmentCreate:
      type: object
      additionalProperties: false
      required: [storage_key, file_name, content_type, size_bytes]
      properties:
        storage_key:
          type: string
          pattern: '^tickets/[0-9a-f-]{36}/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Path used when uploading through /api/files; must be under tickets/<ticketId>/.
        file_name: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf] }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
    Attachment:
      type: object
      additionalProperties: false
      required: [id, ticket_id, storage_key, file_name, content_type, size_bytes, source, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        storage_key: { type: string }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        source: { $ref: '#/components/schemas/DataSource' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    TicketEvent:
      type: object
      additionalProperties: false
      required: [id, ticket_id, action, actor_sub, source, details, occurred_at]
      properties:
        id: { type: integer, format: int64 }
        ticket_id: { type: string, format: uuid }
        action: { type: string }
        from_status:
          $ref: '#/components/schemas/NullableTicketStatus'
        to_status:
          $ref: '#/components/schemas/NullableTicketStatus'
        actor_sub: { type: string }
        source: { $ref: '#/components/schemas/DataSource' }
        details: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    TicketProvenance:
      type: object
      additionalProperties: false
      required: [ticket_id, source, created_by, created_at, updated_at, deleted_at, reopen_count, events]
      properties:
        ticket_id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/DataSource' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        reopen_count: { type: integer, minimum: 0 }
        events:
          type: array
          items: { $ref: '#/components/schemas/TicketEvent' }
    TicketStats:
      type: object
      additionalProperties: false
      required: [total, by_status, by_category, by_co_so, average_resolution_hours,
                 overdue_count, reopen_count]
      properties:
        total: { type: integer, minimum: 0 }
        by_co_so:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Counts keyed by site (CS1, CS2, CS3).
        reopen_count: { type: integer, minimum: 0 }
        by_status:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
