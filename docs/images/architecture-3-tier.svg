<text x="40" y="74" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">DX-OS Open-Core, không gian H-P-D-I và ứng dụng DX-Helpdesk</text>
