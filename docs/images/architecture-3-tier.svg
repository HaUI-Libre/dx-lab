<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
<title id="t">Kiến trúc 3 tầng DX-Lab</title><desc id="d">Tầng 3 DX-Helpdesk gọi qua API Gateway APISIX tới Tầng 2 H-P-D-I và dịch vụ tích hợp tài sản, dùng Tầng 1 Open-Core gồm Keycloak, PostgreSQL, Flowable, SeaweedFS và NATS; ngoài DX-OS có Snipe-IT và giám sát.</desc>
