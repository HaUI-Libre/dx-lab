<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">Quy trình sửa chữa thiết bị DX-Helpdesk</title><desc id="d">Vòng đời phiếu DRAFT, SUBMITTED, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED; từ chối ở bước tiếp nhận sang REJECTED; mở lại ở bước nghiệm thu về IN_PROGRESS.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="480" fill="#ffffff"/>
<text x="40" y="48" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Quy trình sửa chữa thiết bị</text>
<text x="40" y="74" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Flowable điều phối từng bước; Data API giữ trạng thái phiếu và kiểm quyền theo vai trò và cơ sở (co_so)</text>
<rect x="40" y="150" width="112" height="52" rx="26" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="96.0" y="182" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">DRAFT</text>
<rect x="240" y="150" width="112" height="52" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="296.0" y="182" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">SUBMITTED</text>
<rect x="440" y="150" width="112" height="52" rx="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="496.0" y="182" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">ASSIGNED</text>
<rect x="640" y="150" width="112" height="52" rx="26" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="696.0" y="182" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">IN_PROGRESS</text>
<rect x="840" y="150" width="112" height="52" rx="26" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="896.0" y="182" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">RESOLVED</text>
<rect x="1040" y="150" width="112" height="52" rx="26" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="1096.0" y="182" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">CLOSED</text>
<path d="M156 176.0 L236 176.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="196.0" y="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Gửi yêu cầu</text>
<text x="196.0" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Sinh viên</text>
<path d="M356 176.0 L436 176.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="396.0" y="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Phân công</text>
<text x="396.0" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Trưởng phòng</text>
<path d="M556 176.0 L636 176.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="596.0" y="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Nhận việc</text>
<text x="596.0" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Kỹ thuật viên</text>
<path d="M756 176.0 L836 176.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="796.0" y="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hoàn thành</text>
<text x="796.0" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Kỹ thuật viên</text>
<path d="M956 176.0 L1036 176.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="996.0" y="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Nghiệm thu</text>
<text x="996.0" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Trưởng phòng</text>
<path d="M296.0 206 L296.0 270" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="240" y="274" width="112" height="52" rx="26" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="296.0" y="306" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">REJECTED</text>
<text x="308.0" y="242" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start">Từ chối + lý do</text>
<text x="308.0" y="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Trưởng phòng, kết thúc</text>
<path d="M896.0 206 L896.0 272 L696.0 272 L696.0 206" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" marker-end="url(#ao)"/>
<text x="796.0" y="294" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">Mở lại + lý do · Trưởng phòng</text>
<text x="796.0" y="312" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Giao lại đúng kỹ thuật viên cũ, lịch sử ghi REOPEN</text>
<rect x="40" y="352" width="1120" height="96" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
<text x="60" y="380" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7e22ce" text-anchor="start">Đồng bộ nhãn tài sản trên Snipe-IT</text>
<text x="60" y="406" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Khi kỹ thuật viên nhận việc: thiết bị chuyển nhãn "Đang sửa chữa". Khi nghiệm thu đóng phiếu: trả nhãn ban đầu và ghi số phiếu vào ghi chú.</text>
<text x="60" y="428" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Sự kiện đi qua NATS JetStream; nếu Snipe-IT hoặc dịch vụ tích hợp lỗi, lỗi được ghi lại và không chặn quy trình.</text>
</svg>
