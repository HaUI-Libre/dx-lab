<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Kiến trúc tích hợp hệ thống tài sản của khách hàng</title><desc id="d">DX-Helpdesk gọi APISIX; Data API và dịch vụ asset-sync nằm trong Tầng 2. Data API phát sự kiện đổi trạng thái qua NATS JetStream; asset-sync nhận sự kiện và gọi REST API của Snipe-IT, đặt ngoài DX-OS cùng MariaDB.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7e22ce"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="48" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Tích hợp hệ thống tài sản của khách hàng</text>
<text x="40" y="74" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Snipe-IT giả lập phần mềm quản lý tài sản có sẵn của trường; chỉ asset-sync gọi API của nó</text>
<rect x="40" y="100" width="800" height="468" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="128" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">DX-OS</text>
<rect x="60" y="146" width="250" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="76" y="172" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">DX-Helpdesk</text>
<text x="76" y="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Nuxt 4, Tầng 3</text>
<path d="M310 178 L350 178" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<rect x="350" y="146" width="470" height="64" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="366" y="172" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">API Gateway, Apache APISIX</text>
<text x="366" y="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#cbd5e1" text-anchor="start">Token Keycloak (JWKS), kiểm vai trò dxlab-roles</text>
<rect x="60" y="270" width="270" height="92" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="76" y="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Data API</text>
<text x="76" y="320" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ticket, provenance, định tuyến</text>
<text x="76" y="339" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">theo cơ sở, thống kê</text>
<rect x="380" y="270" width="190" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="396" y="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">NATS JetStream</text>
<text x="396" y="320" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">dxlab.ticket.</text>
<text x="396" y="339" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">status_changed</text>
<rect x="620" y="270" width="200" height="92" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="636" y="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">asset-sync</text>
<text x="636" y="320" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Adapter Snipe-IT,</text>
<text x="636" y="339" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">thử lại khi lỗi</text>
<path d="M195 210 L195 270" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="207" y="244" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">/api/data</text>
<path d="M720 210 L720 270" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="732" y="244" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">/api/assets</text>
<path d="M330 316 L380 316" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ao)"/>
<path d="M570 316 L620 316" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ao)"/>
<rect x="60" y="440" width="130" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="76" y="466" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">PostgreSQL</text>
<text x="76" y="488" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">+ PostGIS</text>
<text x="76" y="507" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">dxdata</text>
<rect x="200" y="440" width="130" height="84" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="216" y="466" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Flowable</text>
<text x="216" y="488" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">BPMN, REST</text>
<text x="216" y="507" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">headless</text>
<path d="M125 362 L125 440" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" marker-end="url(#ag)"/>
<path d="M265 362 L265 440" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" marker-end="url(#ag)"/>
<rect x="380" y="440" width="440" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="396" y="466" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Lưu ý</text>
<text x="396" y="488" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">NATS giữ sự kiện khi asset-sync dừng, nên không mất</text>
<text x="396" y="508" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">cập nhật nhãn. Data API, asset-sync: Tầng 2; còn lại: Tầng 1.</text>
<rect x="880" y="100" width="280" height="468" rx="14" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="900" y="128" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="start">HỆ THỐNG CỦA KHÁCH HÀNG</text>
<text x="900" y="148" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Ngoài DX-OS, profile integration</text>
<rect x="900" y="270" width="240" height="92" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
<text x="916" y="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Snipe-IT v8.8.0</text>
<text x="916" y="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">REST API /api/v1</text>
<text x="916" y="337" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">AGPL-3.0, không sửa mã</text>
<rect x="900" y="440" width="240" height="84" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
<text x="916" y="466" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">MariaDB 11.4.7</text>
<text x="916" y="488" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Chỉ Snipe-IT kết nối</text>
<path d="M820 316 L900 316" fill="none" stroke="#7e22ce" stroke-width="2" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="860" y="300" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">REST</text>
<path d="M1020 362 L1020 440" fill="none" stroke="#7e22ce" stroke-width="2" stroke-linejoin="round" marker-end="url(#ap)"/>
<rect x="40" y="592" width="1120" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="60" y="618" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Endpoint Snipe-IT dùng:</text>
<text x="228" y="618" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">GET users/{id}/assets   ·   GET hardware/bytag/{tag}   ·   GET locations/{id}/assets   ·   PATCH hardware/{id} (nhãn trạng thái)</text>
<text x="60" y="640" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">DX-Lab không đọc database MariaDB và không sửa mã Snipe-IT; nghĩa vụ AGPL không lan sang mã Apache-2.0 của đội.</text>
<path d="M40 682 L76 682" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#ab)"/>
<text x="86" y="686" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">REST đồng bộ</text>
<path d="M220 682 L256 682" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#ao)"/>
<text x="266" y="686" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Sự kiện bất đồng bộ</text>
