name: dxlab

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-dxlab}
      # Dùng bởi core/postgres/init/01-create-databases.sh
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Thiếu KEYCLOAK_DB_PASSWORD trong .env}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?Thiếu FLOWABLE_DB_PASSWORD trong .env}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?Thiếu DATA_DB_PASSWORD trong .env}
    volumes:
      # Từ PostgreSQL 18, image chính thức lưu dữ liệu dưới /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
      - ./core/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Chỉ mở cho máy cục bộ, phục vụ psql khi phát triển
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
