name: dxlab

services:
  postgres:
    # PostgreSQL 18.6 kèm PostGIS 3.6.4 (#76). Docker Hub chỉ có tag trôi 18-3.6-alpine,
    # được build lại hằng ngày, nên ghim thêm digest để mọi máy dựng cùng một image.
    image: postgis/postgis:18-3.6-alpine@sha256:fd143c649af607c6872a1e59ccb3e43c299f207ab975a4c286fbb204b6e6f7b7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-dxlab}
      # Dùng bởi core/postgres/init/01-create-databases.sh
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Thiếu KEYCLOAK_DB_PASSWORD trong .env}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?Thiếu FLOWABLE_DB_PASSWORD trong .env}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?Thiếu DATA_DB_PASSWORD trong .env}
      # Dùng bởi core/postgres/init/03-create-monitor-role.sh cho postgres_exporter (#78)
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-}
    volumes:
      # Từ PostgreSQL 18, image chính thức lưu dữ liệu dưới /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
      - ./core/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Chỉ mở cho máy cục bộ, phục vụ psql khi phát triển
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    # start-dev: HTTP, không cần TLS — chỉ dùng cho môi trường lab/phát triển
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Thiếu KEYCLOAK_ADMIN trong .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Thiếu KEYCLOAK_ADMIN_PASSWORD trong .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Metric ở cổng quản trị 9000, chỉ Prometheus trong mạng Docker đọc (#78)
      KC_METRICS_ENABLED: "true"
      # Ghim issuer theo địa chỉ trình duyệt dùng, để token lấy từ máy host và từ
      # container khác (APISIX) có cùng "iss"; backchannel vẫn gọi được keycloak:8080
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Thay thế ${...} trong core/identity/realm-dxlab.json khi import
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dxlab}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dxlab-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Thiếu KEYCLOAK_CLIENT_SECRET trong .env}
      DATA_API_CLIENT_SECRET: ${DATA_API_CLIENT_SECRET:?Thiếu DATA_API_CLIENT_SECRET trong .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Thiếu DEMO_USER_PASSWORD trong .env}
      # Redirect URI và web origin của client dxlab-app trỏ về ứng dụng Nuxt
      APP_URL: http://localhost:${APP_PORT:-3000}
    volumes:
      # Realm chỉ được import nếu chưa tồn tại; sửa file thì xem core/identity/README.md
      - ./core/identity/realm-dxlab.json:/opt/keycloak/data/import/realm-dxlab.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image không có curl; gọi /health/ready trên cổng quản trị 9000 bằng bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": *\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  apisix:
    image: apache/apisix:3.19.0-debian
    restart: unless-stopped
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dxlab}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dxlab-app}
      # Origin được phép gọi gateway (CORS)
      APP_URL: http://localhost:${APP_PORT:-3000}
      # Chỉ APISIX dùng tài khoản REST nội bộ sau khi đã xác thực token Keycloak.
      FLOWABLE_ADMIN_USER: ${FLOWABLE_ADMIN_USER:?Thiếu FLOWABLE_ADMIN_USER trong .env}
      FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?Thiếu FLOWABLE_ADMIN_PASSWORD trong .env}
      DATA_WORKFLOW_KEY: ${DATA_WORKFLOW_KEY:?Thiếu DATA_WORKFLOW_KEY trong .env}
    volumes:
      - ./core/gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./core/gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./core/gateway/plugins:/usr/local/apisix/custom:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9080}:9080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # /status/ready trả 200 khi mọi worker đã nạp xong apisix.yaml.
      # Gọi bash trực tiếp vì /bin/sh của image (dash) không có /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  flowable:
    image: flowable/flowable-rest:7.2.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:?Thiếu FLOWABLE_DB_PASSWORD trong .env}
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_ADMIN_USER:?Thiếu FLOWABLE_ADMIN_USER trong .env}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?Thiếu FLOWABLE_ADMIN_PASSWORD trong .env}
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      FLOWABLE_DATABASE_SCHEMA_UPDATE: "true"
      FLOWABLE_HISTORY_LEVEL: full
    # Không publish cổng REST; người dùng chỉ gọi qua APISIX.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # actuator/health cần tài khoản REST; BusyBox wget không có --password nên tự tạo header
      test: ["CMD-SHELL", "wget -qO /dev/null --header \"Authorization: Basic $$(printf %s \"$$FLOWABLE_REST_APP_ADMIN_USER_ID:$$FLOWABLE_REST_APP_ADMIN_PASSWORD\" | base64 | tr -d '\\n')\" http://127.0.0.1:8080/flowable-rest/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Chạy một lần sau khi Flowable healthy để deploy BPMN. Nằm trong profile setup để
  # `docker compose up --wait` không chờ một container sẽ tự thoát; make up/demo gọi
  # nó bằng `docker compose run`.
  workflow-deploy:
    profiles: [setup]
    build:
      context: ./core/workflow
      dockerfile: Dockerfile
    environment:
      FLOWABLE_URL: ${FLOWABLE_INTERNAL_URL:-http://flowable:8080/flowable-rest/service}
      FLOWABLE_ADMIN_USER: ${FLOWABLE_ADMIN_USER:?Thiếu FLOWABLE_ADMIN_USER trong .env}
      FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?Thiếu FLOWABLE_ADMIN_PASSWORD trong .env}
    depends_on:
      flowable:
        condition: service_healthy
    restart: "no"

  data-api:
    build:
      context: ./data
      dockerfile: Dockerfile
    image: dxlab-data-api:local
    restart: unless-stopped
    environment:
      DATA_DB_HOST: postgres
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD:?Thiếu DATA_DB_PASSWORD trong .env}
      DATA_WORKFLOW_URL: http://apisix:9080/api/workflow/data
      DATA_WORKFLOW_KEY: ${DATA_WORKFLOW_KEY:?Thiếu DATA_WORKFLOW_KEY trong .env}
      DATA_ASSET_STATUS_URL: ${DATA_ASSET_STATUS_URL:-http://apisix:9080/api/assets/internal/status}
      # Có NATS (profile integration) thì phát sự kiện; không kết nối được thì gọi thẳng URL trên
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      DATA_ASSET_URL: ${DATA_ASSET_URL:-http://apisix:9080/api/assets}
      DATA_ASSET_KEY: ${DATA_ASSET_KEY:-changeme}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/${KEYCLOAK_REALM:-dxlab}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-dxlab}/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dxlab-app}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dxlab}
      # Service account chỉ có quyền view-users trong realm, không dùng tài khoản admin
      DATA_API_CLIENT_SECRET: ${DATA_API_CLIENT_SECRET:?Thiếu DATA_API_CLIENT_SECRET trong .env}
    depends_on:
      postgres:
        condition: service_healthy
      apisix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    image: dxlab-ai:local
    restart: unless-stopped
    environment:
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/service/model.joblib}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # master + volume + filer trong một tiến trình, đủ cho lab.
    # Không bật S3; Tầng 2/3 gọi qua /api/files của gateway.
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -filer
      - -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
    # Không publish cổng; người dùng chỉ gọi qua APISIX
    healthcheck:
      # Tạo bucket documents (thư mục /buckets/documents của filer) nếu chưa có:
      # 201 là vừa tạo, 409 là đã tồn tại. Service chỉ healthy khi bucket sẵn sàng.
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8888/buckets/documents/) && [ \"$$code\" = 201 ] || [ \"$$code\" = 409 ]"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Tầng 3: ứng dụng DX-Helpdesk (Nuxt 4). Server Nuxt đăng nhập với Keycloak
  # và gọi API qua APISIX; trình duyệt không nhận token.
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: dxlab-app:local
    restart: unless-stopped
    environment:
      NUXT_APP_URL: http://localhost:${APP_PORT:-3000}
      NUXT_OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-dxlab}
      NUXT_OIDC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dxlab-app}
      NUXT_OIDC_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Thiếu KEYCLOAK_CLIENT_SECRET trong .env}
      NUXT_GATEWAY_URL: http://apisix:9080
      NUXT_SESSION_PASSWORD: ${APP_SESSION_PASSWORD:?Thiếu APP_SESSION_PASSWORD trong .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      apisix:
        condition: service_healthy

  # Giả lập phần mềm quản lý tài sản có sẵn của khách hàng (ngoài DX-OS)
  mariadb:
    image: mariadb:11.4.7
    restart: unless-stopped
    profiles: ["integration"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Thiếu MARIADB_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${SNIPEIT_DB_DATABASE:-snipeit}
      MYSQL_USER: ${SNIPEIT_DB_USERNAME:-snipeit}
      MYSQL_PASSWORD: ${SNIPEIT_DB_PASSWORD:?Thiếu SNIPEIT_DB_PASSWORD trong .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    # MariaDB không mở cổng ra host; chỉ snipeit trong cùng mạng Docker kết nối
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  snipeit:
    image: snipe/snipe-it:v8.8.0
    restart: unless-stopped
    profiles: ["integration"]
    entrypoint: ["/opt/dxlab/entrypoint.sh"]
    environment:
      APP_URL: http://127.0.0.1:${SNIPEIT_PORT:-8081}
      APP_KEY: ${SNIPEIT_APP_KEY:-changeme}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      APP_LOCALE: vi
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${SNIPEIT_DB_DATABASE:-snipeit}
      DB_USERNAME: ${SNIPEIT_DB_USERNAME:-snipeit}
      DB_PASSWORD: ${SNIPEIT_DB_PASSWORD:?Thiếu SNIPEIT_DB_PASSWORD trong .env}
      SNIPEIT_ADMIN_USER: ${SNIPEIT_ADMIN_USER:-admin}
      SNIPEIT_ADMIN_PASSWORD: ${SNIPEIT_ADMIN_PASSWORD:?Thiếu SNIPEIT_ADMIN_PASSWORD trong .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-changeme}
    volumes:
      - snipeit-data:/var/lib/snipeit
      - ./core/snipeit:/opt/dxlab:ro
      - ./data/samples/snipeit_seed.json:/opt/dxlab-data/snipeit_seed.json:ro
      - snipeit-token:/token
    ports:
      # Chỉ bind trên loopback của máy host, phục vụ kiểm tra và demo
      - "127.0.0.1:${SNIPEIT_PORT:-8081}:80"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /token/snipeit_api_token && curl -f -s http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s

  # Trục sự kiện (ADR-07, #77). JetStream lưu sự kiện trên đĩa để dịch vụ tích hợp
  # dừng rồi bật lại vẫn nhận đủ. Không mở cổng ra máy; 8222 là cổng monitoring nội bộ.
  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    profiles: ["integration"]
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  asset-sync:
    build:
      context: ./integration/assets
      dockerfile: Dockerfile
    image: dxlab-asset-sync:local
    restart: unless-stopped
    profiles: ["integration"]
    environment:
      SNIPEIT_API_URL: ${SNIPEIT_API_URL:-http://snipeit/api/v1}
      SNIPEIT_TOKEN_FILE: /token/snipeit_api_token
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      ASSET_STATE_DB: /state/updates.sqlite3
      ASSET_RETRY_SECONDS: ${ASSET_RETRY_SECONDS:-60}
      ASSET_REPAIR_LABEL: ${ASSET_REPAIR_LABEL:-Đang sửa chữa}
      ASSET_SITE_ROOTS: ${ASSET_SITE_ROOTS:-1:CS1,9:CS2,15:CS3}
      DATA_ASSET_KEY: ${DATA_ASSET_KEY:?Thiếu DATA_ASSET_KEY trong .env}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/${KEYCLOAK_REALM:-dxlab}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-dxlab}/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dxlab-app}
    volumes:
      - snipeit-token:/token:ro
      - asset-sync-data:/state
    depends_on:
      snipeit:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Profile monitoring (#78). Không cổng metric nào mở ra máy; chỉ Grafana bind 127.0.0.1.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./core/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 15

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Thiếu GRAFANA_ADMIN_PASSWORD trong .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Không gửi số liệu sử dụng hay kiểm tra bản mới ra Internet
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dxlab-overview.json
    volumes:
      - ./core/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./core/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 15

  # Đọc thống kê bằng role dxmonitor (pg_monitor), không dùng tài khoản superuser
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-dxlab}?sslmode=disable
      DATA_SOURCE_USER: dxmonitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:?Thiếu MONITOR_DB_PASSWORD trong .env}
    depends_on:
      postgres:
        condition: service_healthy

  # NATS thuộc profile integration; bật monitoring một mình thì target này "down"
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.2
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["-varz", "-connz", "-jsz=all", "http://nats:8222"]

volumes:
  postgres-data:
  seaweedfs-data:
  mariadb-data:
  snipeit-data:
  nats-data:
  snipeit-token:
  asset-sync-data:
  prometheus-data:
  grafana-data:

