name: AI classifier

on:
  pull_request:
    paths:
      - 'ai/**'
      - 'data/samples/training_data.jsonl'
      - 'tests/test_ai_*.py'
      - '.github/workflows/ai.yml'
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'data/samples/training_data.jsonl'
      - 'tests/test_ai_*.py'
      - '.github/workflows/ai.yml'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r ai/requirements.txt httpx==0.28.1 pytest==8.4.2
      - run: python -m pytest -q tests/test_ai_*.py
      - run: python ai/train.py --data data/samples/training_data.jsonl --output /tmp/dxlab-model.joblib
