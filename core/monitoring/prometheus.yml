# Prometheus của profile monitoring (#78). Mọi target nằm trong mạng Docker; không
# cổng metric nào mở ra máy host. Target thuộc profile đang tắt (ví dụ integration)
# hiện "down" trên dashboard, không làm Prometheus lỗi.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Plugin prometheus của APISIX, cổng 9091 khai ở core/gateway/config.yaml
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]

  # Keycloak bật KC_METRICS_ENABLED; metric nằm trên cổng quản trị 9000
  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: data-api
    static_configs:
      - targets: ["data-api:9100"]

  - job_name: asset-sync
    static_configs:
      - targets: ["asset-sync:9100"]

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
