apiVersion: 1

# Dashboard là tệp JSON trong repo; sửa trên giao diện Grafana không được lưu lại
providers:
  - name: dxlab
    folder: DX-Lab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
