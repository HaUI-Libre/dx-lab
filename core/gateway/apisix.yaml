# Route của API Gateway. APISIX đọc lại file khi nó thay đổi, không cần khởi động lại.
# Vai trò lấy theo ma trận RBAC trong đặc tả M1.3.

plugin_configs:
  - id: auth
    desc: Xác thực token Keycloak và CORS cho ứng dụng Nuxt
    plugins:
      request-id:
        include_in_response: true
      cors:
        allow_origins: ${{APP_URL}}
        allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
        allow_headers: Authorization,Content-Type
        expose_headers: X-Request-Id
        allow_credential: true
      openid-connect:
        client_id: ${{KEYCLOAK_CLIENT_ID}}
        discovery: http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/openid-configuration
        realm: ${{KEYCLOAK_REALM}}
        # Chỉ nhận Bearer token, kiểm tra chữ ký bằng JWKS, không gọi Keycloak mỗi request
        bearer_only: true
        use_jwks: true
        set_userinfo_header: true
        set_access_token_header: false

  # Dùng chung cho mọi route /api/files. Ba plugin đầu giữ giống plugin_config auth
  # vì một route chỉ gắn được một plugin_config.
  - id: files
    desc: Xác thực, chặn đường dẫn vượt thư mục và chuyển tiếp tới bucket documents
    plugins:
      request-id:
        include_in_response: true
      cors:
        allow_origins: ${{APP_URL}}
        allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
        allow_headers: Authorization,Content-Type
        expose_headers: X-Request-Id
        allow_credential: true
      openid-connect:
        client_id: ${{KEYCLOAK_CLIENT_ID}}
        discovery: http://keycloak:8080/realms/${{KEYCLOAK_REALM}}/.well-known/openid-configuration
        realm: ${{KEYCLOAK_REALM}}
        bearer_only: true
        use_jwks: true
        set_userinfo_header: true
        set_access_token_header: false
      # upstream_uri dựng lại không kèm query string, nên tham số quản trị của filer
      # như ?mv.from= bị bỏ.
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              -- ctx.var.uri và request_uri đã được chuẩn hoá ("/../" bị gộp, %2e bị
              -- giải mã) nên uri-blocker không thấy; kiểm tra trên dòng request gốc.
              if ngx.re.find(ngx.var.request_line or "", [[\.\.|%2e]], "joi") then
                core.response.set_header("Content-Type", "application/json")
                return core.response.exit(403, { error = "path traversal is not allowed" })
              end
              -- Mỗi đoạn đường dẫn bắt đầu bằng chữ/số, chỉ gồm chữ, số, '.', '_', '-'
              local m = ngx.re.match(ctx.var.uri,
                [[^/api/files/([A-Za-z0-9][A-Za-z0-9._-]{0,127}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,127}){0,4})$]], "jo")
              if not m then
                core.response.set_header("Content-Type", "application/json")
                return core.response.exit(400, { error = "invalid file path" })
              end
              core.request.set_header(ctx, "Authorization", nil)
              ctx.var.upstream_uri = "/buckets/documents/" .. m[1]
            end
      # Không cho trình duyệt đoán kiểu hay chạy script trong tệp người dùng tải lên
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: nosniff
            Content-Security-Policy: "sandbox; default-src 'none'"

upstreams:
  # Các upstream chưa được triển khai sẽ trả 502/503 sau khi xác thực.
  - id: data-api
    type: roundrobin
    nodes:
      data-api:8000: 1
  - id: flowable
    type: roundrobin
    nodes:
      flowable:8080: 1
  - id: seaweedfs
    type: roundrobin
    nodes:
      seaweedfs:8888: 1
  - id: ai
    type: roundrobin
    nodes:
      ai:8000: 1

routes:
  # Thông tin người đang đăng nhập, trả thẳng từ token đã được openid-connect xác thực
  - id: me
    uri: /api/me
    methods: [GET, OPTIONS]
    plugin_config_id: auth
    plugins:
      dxlab-roles:
        roles: [ROLE_STUDENT, ROLE_TECHNICIAN, ROLE_LAB_MANAGER, ROLE_ADMIN]
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local claims = core.json.decode(ngx.decode_base64(core.request.header(ctx, "X-Userinfo")))
              local roles = {}
              for _, r in ipairs(claims.realm_access and claims.realm_access.roles or {}) do
                if r:find("^ROLE_") then roles[#roles + 1] = r end
              end
              core.response.set_header("Content-Type", "application/json")
              return core.response.exit(200, {
                sub = claims.sub,
                username = claims.preferred_username,
                name = claims.name,
                email = claims.email,
                roles = roles,
                -- Thuộc tính cơ sở do Keycloak gắn vào token (#74); nil thì không trả
                co_so = claims.co_so,
              })
            end

  # Dashboard: chỉ trưởng phòng lab và quản trị
  - id: data-stats
    uri: /api/data/stats*
    plugin_config_id: auth
    upstream_id: data-api
    plugins:
      dxlab-roles:
        roles: [ROLE_LAB_MANAGER, ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/data/(.*)", "/$1"]

  - id: data
    uri: /api/data/*
    plugin_config_id: auth
    upstream_id: data-api
    plugins:
      dxlab-roles:
        roles: [ROLE_STUDENT, ROLE_TECHNICIAN, ROLE_LAB_MANAGER, ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/data/(.*)", "/$1"]

  # Issue #15 chỉ công bố API liệt kê process definition. Không mở các API
  # ghi/xóa của Flowable qua tài khoản REST quản trị dùng chung.
  - id: workflow-process-definitions
    uri: /api/workflow/repository/process-definitions
    methods: [GET, OPTIONS]
    plugin_config_id: auth
    upstream_id: flowable
    plugins:
      dxlab-roles:
        roles: [ROLE_STUDENT, ROLE_TECHNICIAN, ROLE_LAB_MANAGER, ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/workflow/(.*)", "/flowable-rest/service/$1"]
      # Flowable REST dùng Basic Auth riêng. Chỉ thay Authorization sau khi
      # openid-connect và dxlab-roles đã xác thực Bearer token ở pha rewrite.
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = os.getenv("FLOWABLE_ADMIN_USER")
              local password = os.getenv("FLOWABLE_ADMIN_PASSWORD")
              if not user or user == "" or not password or password == "" then
                core.response.set_header("Content-Type", "application/json")
                return core.response.exit(503, { error = "workflow unavailable" })
              end
              core.request.set_header(ctx, "Authorization",
                "Basic " .. ngx.encode_base64(user .. ":" .. password))
            end

  # API kiểm thử BPMN (#19): chỉ admin demo dùng trực tiếp. Luồng sản phẩm
  # phải qua Data API (#20) để kiểm tra chủ sở hữu task và co_so.
  - id: workflow-test-process-instances
    uri: /api/workflow/runtime/process-instances
    methods: [POST, OPTIONS]
    plugin_config_id: auth
    upstream_id: flowable
    plugins:
      dxlab-roles:
        roles: [ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/workflow/(.*)", "/flowable-rest/service/$1"]
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = os.getenv("FLOWABLE_ADMIN_USER")
              local password = os.getenv("FLOWABLE_ADMIN_PASSWORD")
              if not user or user == "" or not password or password == "" then
                return core.response.exit(503, { error = "workflow unavailable" })
              end
              core.request.set_header(ctx, "Authorization",
                "Basic " .. ngx.encode_base64(user .. ":" .. password))
            end

  - id: workflow-test-tasks
    uri: /api/workflow/runtime/tasks
    methods: [GET, OPTIONS]
    plugin_config_id: auth
    upstream_id: flowable
    plugins:
      dxlab-roles:
        roles: [ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/workflow/(.*)", "/flowable-rest/service/$1"]
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = os.getenv("FLOWABLE_ADMIN_USER")
              local password = os.getenv("FLOWABLE_ADMIN_PASSWORD")
              if not user or user == "" or not password or password == "" then
                return core.response.exit(503, { error = "workflow unavailable" })
              end
              core.request.set_header(ctx, "Authorization",
                "Basic " .. ngx.encode_base64(user .. ":" .. password))
            end

  - id: workflow-test-task-complete
    uri: /api/workflow/runtime/tasks/*
    methods: [POST, OPTIONS]
    plugin_config_id: auth
    upstream_id: flowable
    plugins:
      dxlab-roles:
        roles: [ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/workflow/(.*)", "/flowable-rest/service/$1"]
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              if not ngx.re.match(ctx.var.uri,
                [[^/api/workflow/runtime/tasks/[A-Za-z0-9_-]+$]], "jo") then
                return core.response.exit(400, { error = "invalid task path" })
              end
              local user = os.getenv("FLOWABLE_ADMIN_USER")
              local password = os.getenv("FLOWABLE_ADMIN_PASSWORD")
              if not user or user == "" or not password or password == "" then
                return core.response.exit(503, { error = "workflow unavailable" })
              end
              core.request.set_header(ctx, "Authorization",
                "Basic " .. ngx.encode_base64(user .. ":" .. password))
            end

  - id: workflow-test-history
    uri: /api/workflow/history/historic-*
    methods: [GET, OPTIONS]
    plugin_config_id: auth
    upstream_id: flowable
    plugins:
      dxlab-roles:
        roles: [ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/workflow/(.*)", "/flowable-rest/service/$1"]
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = os.getenv("FLOWABLE_ADMIN_USER")
              local password = os.getenv("FLOWABLE_ADMIN_PASSWORD")
              if not user or user == "" or not password or password == "" then
                return core.response.exit(503, { error = "workflow unavailable" })
              end
              core.request.set_header(ctx, "Authorization",
                "Basic " .. ngx.encode_base64(user .. ":" .. password))
            end

  # Tệp trong bucket documents của SeaweedFS (issue #14). Mọi route /api/files dùng
  # plugin_config files; quyền theo đường dẫn nằm ở dxlab-roles của từng route.
  # Route cụ thể có priority cao hơn route chung nên được chọn trước khi khớp cả URI
  # lẫn method. allowedRoles trong metadata của portal chỉ để hiển thị.
  - id: files-guides-admin-read
    uri: /api/files/guides/admin/*
    methods: [GET, HEAD, OPTIONS]
    priority: 20
    plugin_config_id: files
    upstream_id: seaweedfs
    plugins:
      dxlab-roles:
        roles: [ROLE_ADMIN]

  - id: files-guides-technician-read
    uri: /api/files/guides/technician/*
    methods: [GET, HEAD, OPTIONS]
    priority: 20
    plugin_config_id: files
    upstream_id: seaweedfs
    plugins:
      dxlab-roles:
        roles: [ROLE_TECHNICIAN, ROLE_LAB_MANAGER, ROLE_ADMIN]

  # Tài liệu hướng dẫn và manifest của portal: chỉ quản lý và admin được ghi, xoá.
  # Gồm cả đường dẫn không có dấu / cuối để không lọt xuống route chung.
  - id: files-guides-portal-write
    uris: [/api/files/guides, /api/files/guides/*, /api/files/portal, /api/files/portal/*]
    methods: [PUT, POST, DELETE, OPTIONS]
    priority: 10
    plugin_config_id: files
    upstream_id: seaweedfs
    plugins:
      dxlab-roles:
        roles: [ROLE_LAB_MANAGER, ROLE_ADMIN]

  # Route chung: mọi vai trò đã đăng nhập đọc và tải lên, gồm guides/public/ và portal/.
  # Không mở xoá, liệt kê thư mục hay tham số quản trị của filer.
  - id: files
    uri: /api/files/*
    methods: [GET, HEAD, PUT, POST, OPTIONS]
    priority: 0
    plugin_config_id: files
    upstream_id: seaweedfs
    plugins:
      dxlab-roles:
        roles: [ROLE_STUDENT, ROLE_TECHNICIAN, ROLE_LAB_MANAGER, ROLE_ADMIN]

  - id: ai
    uri: /api/ai/*
    plugin_config_id: auth
    upstream_id: ai
    plugins:
      dxlab-roles:
        roles: [ROLE_STUDENT, ROLE_TECHNICIAN, ROLE_LAB_MANAGER, ROLE_ADMIN]
      proxy-rewrite:
        regex_uri: ["^/api/ai/(.*)", "/$1"]

#END
